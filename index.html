<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 태블릿 확대/스크롤 방지 (SPEC 1.2, Phase0 §13) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>곱셈나눗셈 아케이드 천국</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000; /* 레터박스 여백은 검정 */
        overflow: hidden;
        overscroll-behavior: none; /* 당겨서 새로고침/바운스 방지 */
        touch-action: none; /* 브라우저 제스처 차단 */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
      }
      /* 캔버스는 중앙 정렬 + object-fit:contain 스케일링(위치/크기는 engine.resize가 설정) */
      #game {
        position: absolute;
        display: block;
        background: #101828;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
